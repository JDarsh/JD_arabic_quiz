<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اخْتِبَارٌ تَفَاعُلِيّ - قَوَاعِدُ نَحْوِيَّةٌ شَامِلَة</title>
    <style>
        :root {
            /* Theme colors - Navy Blue and Gold representing Comprehensive Knowledge & Excellence */
            --primary: #0f172a; /* Slate 900 (Navy) */
            --secondary: #fbbf24; /* Amber/Gold 400 */
            --white: #ffffff;
            --green: #22c55e;
            --red: #ef4444;
            --dark-bg: #1e293b; /* Slate 800 */
            --text-dark: #020617; /* Slate 950 */
            --black-bg: #020617; /* Slate 950 */
            --accent: #38bdf8; /* Light Blue 400 for highlights */
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--black-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #app-container {
            background-color: var(--primary);
            color: var(--white);
            width: 100vw;
            height: 56.25vw; /* 16:9 Aspect Ratio */
            max-height: 100vh;
            max-width: 177.78vh; /* 16:9 Aspect Ratio */
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 12px;
            background-image: radial-gradient(circle at top right, rgba(251, 191, 36, 0.15), transparent 60%);
        }

        .screen {
            display: none;
            flex-direction: column;
            width: 100%;
            height: 100%;
            padding: 4vh 5vw;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
        }

        .start-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .icon-large {
            width: 18vh;
            height: 18vh;
            margin-bottom: 2vh;
            stroke: var(--secondary);
            stroke-width: 1.5;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        h1 {
            font-size: 6.5vh;
            color: var(--secondary);
            margin: 0 0 2vh 0;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            line-height: 1.3;
        }

        .subtitle {
            font-size: 4.5vh;
            margin-bottom: 6vh;
            font-weight: bold;
            line-height: 1.5;
            color: var(--accent);
        }

        .btn-large {
            background-color: var(--secondary);
            color: var(--text-dark);
            font-size: 5vh;
            font-weight: bold;
            padding: 2vh 6vw;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transition: transform 0.1s, background-color 0.2s;
        }

        .btn-large:active {
            transform: scale(0.95);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 3vh;
            font-weight: bold;
            margin-bottom: 2vh;
            color: var(--secondary);
        }

        .progress-container {
            width: 100%;
            height: 2.5vh;
            background-color: rgba(255,255,255,0.15);
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 4vh;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--secondary);
            width: 0%;
            transition: width 0.3s ease;
        }

        .question-text {
            font-size: 4.5vh;
            font-weight: bold;
            text-align: center;
            margin-bottom: 4vh;
            line-height: 1.5;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3vh;
            margin-bottom: 4vh;
        }

        .option-btn {
            background-color: var(--white);
            color: var(--text-dark);
            font-size: 3.5vh;
            font-weight: bold;
            padding: 3vh 2vw;
            border: 5px solid var(--white);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.25);
            line-height: 1.4;
        }

        .option-btn:disabled {
            cursor: default;
            opacity: 0.9;
        }

        .option-btn.correct {
            background-color: var(--green);
            color: var(--white);
            border-color: var(--green);
        }

        .option-btn.wrong {
            background-color: var(--red);
            color: var(--white);
            border-color: var(--red);
        }

        .feedback-container {
            display: none;
            flex-direction: column;
            align-items: center;
            background-color: rgba(0,0,0,0.4);
            padding: 2.5vh 3vw;
            border-radius: 15px;
            animation: fadeIn 0.3s ease;
        }

        .feedback-message {
            font-size: 4vh;
            font-weight: bold;
            margin-bottom: 1.5vh;
        }

        .feedback-explanation {
            font-size: 3vh;
            color: var(--white);
            text-align: center;
            margin-bottom: 2.5vh;
            line-height: 1.5;
        }

        .btn-next {
            background-color: var(--secondary);
            color: var(--text-dark);
            font-size: 4vh;
            font-weight: bold;
            padding: 1.5vh 5vw;
            border: none;
            border-radius: 30px;
            cursor: pointer;
        }

        .result-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex: 1;
        }

        .score-circle {
            width: 32vh;
            height: 32vh;
            border: 1.5vh solid var(--secondary);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-bottom: 4vh;
            background-color: rgba(251, 191, 36, 0.1);
        }

        .score-text {
            font-size: 8.5vh;
            font-weight: bold;
            color: var(--white);
        }

        .percentage-text {
            font-size: 4.5vh;
            color: var(--secondary);
        }

        .evaluation-text {
            font-size: 6.5vh;
            font-weight: bold;
            margin-bottom: 6vh;
        }

        .result-buttons {
            display: flex;
            gap: 4vw;
        }

        .btn-secondary {
            background-color: transparent;
            color: var(--secondary);
            border: 4px solid var(--secondary);
            font-size: 4.5vh;
            font-weight: bold;
            padding: 2vh 4vw;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .review-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3vh;
            padding-bottom: 2vh;
            border-bottom: 3px solid var(--secondary);
        }

        .review-title {
            font-size: 5.5vh;
            color: var(--secondary);
            margin: 0;
        }

        .review-list {
            flex: 1;
            overflow-y: auto;
            padding-right: 2vw;
            display: flex;
            flex-direction: column;
            gap: 2.5vh;
        }

        .review-list::-webkit-scrollbar { width: 1.2vw; }
        .review-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        .review-list::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 10px; }

        .review-item {
            background-color: rgba(0,0,0,0.25);
            padding: 3.5vh;
            border-radius: 15px;
            border-right: 1.5vw solid var(--secondary);
        }

        .review-q {
            font-size: 4vh;
            font-weight: bold;
            margin-bottom: 2vh;
            line-height: 1.5;
        }

        .review-ans {
            font-size: 3.5vh;
            display: flex;
            flex-direction: column;
            gap: 1.5vh;
            line-height: 1.4;
        }

        .text-green { color: var(--green); font-weight: bold;}
        .text-red { color: var(--red); font-weight: bold;}

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    
        /* ===== Mobile-friendly overrides (phones & portrait tablets) ===== */
        @media (max-width: 780px), (orientation: portrait) {
            body {
                height: 100vh;
                height: 100dvh;
            }
            #app-container {
                width: 100vw !important;
                height: 100vh !important;
                height: 100dvh !important;
                max-width: 100vw !important;
                max-height: 100dvh !important;
                border-radius: 0 !important;
            }
            .screen { padding: 20px 18px; }
            .icon-large { width: 64px; height: 64px; margin-bottom: 10px; }
            h1, .screen h1 { font-size: clamp(19px, 6vw, 27px) !important; margin-bottom: 10px !important; line-height: 1.35; }
            .subtitle { font-size: clamp(14px, 4vw, 17px); margin-bottom: 22px; line-height: 1.6; }
            .btn-large { font-size: clamp(15px, 4.4vw, 18px) !important; padding: 13px 26px !important; }
            .top-bar { font-size: clamp(12px, 3.4vw, 14px); margin-bottom: 10px; }
            .progress-container { height: 8px; margin-bottom: 14px; }
            .question-text { font-size: clamp(16px, 4.6vw, 20px); margin-bottom: 14px; line-height: 1.5; }
            .options-grid { grid-template-columns: 1fr; gap: 9px; margin-bottom: 14px; }
            .option-btn { font-size: clamp(13.5px, 3.8vw, 16px); padding: 13px 10px; border-width: 3px; }
            .feedback-container { padding: 12px 14px; }
            .feedback-message { font-size: clamp(15px, 4.2vw, 17px); margin-bottom: 8px; }
            .feedback-explanation { font-size: clamp(12.5px, 3.4vw, 14.5px); margin-bottom: 12px; }
            .btn-next { font-size: clamp(13px, 3.6vw, 15px) !important; padding: 9px 18px !important; }
            .score-circle { width: 120px; height: 120px; border-width: 7px; margin-bottom: 14px; }
            .score-text { font-size: clamp(24px, 7.5vw, 30px); }
            .percentage-text { font-size: clamp(13px, 3.8vw, 16px); }
            .evaluation-text { font-size: clamp(16px, 4.6vw, 20px); margin-bottom: 14px; }
            .result-buttons { flex-direction: column; gap: 10px; width: 100%; }
            .btn-secondary { font-size: clamp(13px, 3.6vw, 15px); padding: 11px 18px; width: 100%; box-sizing: border-box; }
            .result-container .btn-large { width: 100%; box-sizing: border-box; }
            .review-header { margin-bottom: 10px; padding-bottom: 8px; }
            .review-title { font-size: clamp(16px, 4.6vw, 19px); }
            .review-list { padding-right: 4px; gap: 10px; }
            .review-item { padding: 12px; border-right-width: 4px; }
            .review-q { font-size: clamp(13.5px, 3.8vw, 15.5px); margin-bottom: 6px; }
            .review-ans { font-size: clamp(12px, 3.4vw, 14px); gap: 6px; }
        }

        @media (max-width: 360px) {
            .score-circle { width: 100px; height: 100px; }
            .screen { padding: 16px 14px; }
        }

    </style>
</head>
<body>

<div id="app-container">

    <div id="screen-start" class="screen active">
        <div class="start-content">
            <!-- Crown/Medal Icon representing Comprehensive Excellence in Grammar -->
            <svg class="icon-large" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 4h20M4 4v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4M8 22V4m8 18V4" stroke="var(--secondary)" stroke-width="1.5" fill="rgba(251, 191, 36, 0.1)"></path>
                <path d="M8 10h8m-8 4h5" stroke="var(--accent)" stroke-width="2" stroke-linecap="round"></path>
                <path d="M12 2L15 6 22 5 18 10 20 17 12 14 4 17 6 10 2 5 9 6z" stroke="var(--secondary)" stroke-width="1" fill="none" opacity="0.4"></path>
            </svg>
            <h1>لُغَةٌ عَرَبِيَّةٌ - الصَّفُّ السَّادِسُ</h1>
            <div class="subtitle">مُرَاجَعَةٌ عَامَّةٌ عَلَى القَوَاعِدِ النَّحْوِيَّةِ<br> اخْتِبَارٌ تَفَاعُلِيٌّ شَامِلٌ (٦٠ سُؤَالًا)</div>
            <button class="btn-large" onclick="startQuiz()">اِبْدَأِ الِاخْتِبَارَ</button>
        </div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="top-bar">
            <div id="progress-text">السُّؤَالُ ١ / ٦٠</div>
            <div id="progress-percent">٠٪</div>
        </div>
        <div class="progress-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>

        <div id="question-text" class="question-text">نَصُّ السُّؤَالِ يَظْهَرُ هُنَا؟</div>

        <div id="options-container" class="options-grid">
            <!-- Options dynamically injected -->
        </div>

        <div id="feedback-container" class="feedback-container">
            <div id="feedback-message" class="feedback-message"></div>
            <div id="feedback-explanation" class="feedback-explanation"></div>
            <button id="btn-next" class="btn-next" onclick="nextQuestion()">السُّؤَالُ التَّالِي</button>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <div class="result-container">
            <h1 style="font-size: 7vh; margin-bottom: 4vh;">نَتِيجَةُ الِاخْتِبَارِ الشَّامِلِ</h1>
            <div class="score-circle">
                <div id="score-text" class="score-text">٦٠/٦٠</div>
                <div id="percentage-text" class="percentage-text">١٠٠٪</div>
            </div>
            <div id="evaluation-text" class="evaluation-text" style="color: var(--secondary);">مُمْتَازٌ</div>
            
            <div class="result-buttons">
                <button class="btn-secondary" onclick="showReview()">مُرَاجَعَةُ الإِجَابَاتِ</button>
                <button class="btn-large" style="font-size: 4.5vh; padding: 2vh 4vw;" onclick="restartQuiz()">إِعَادَةُ الِاخْتِبَارِ</button>
            </div>
        </div>
    </div>

    <div id="screen-review" class="screen">
        <div class="review-header">
            <h2 class="review-title">مُرَاجَعَةُ الإِجَابَاتِ</h2>
            <button class="btn-next" onclick="showScreen('screen-result')">عَوْدَةٌ لِلنَّتِيجَةِ</button>
        </div>
        <div id="review-list" class="review-list">
            <!-- Review items injected here -->
        </div>
    </div>

</div>

<script>
    // 60 Questions distributed evenly across:
    // 1- النكرة والمعرفة (12)
    // 2- الأسماء الخمسة (12)
    // 3- أنواع الخبر (12)
    // 4- كان وأخواتها وأنواع خبرها (12)
    // 5- إن وأخواتها وأنواع خبرها (12)
    // All derived strictly from the provided PowerPoint "6ب ترم أول 2026اأ.pptx"

    const allQuestions = [
        // --- 1. النكرة والمعرفة (12 Questions) ---
        { 
            q: "«حَضَرَ مُعَلِّمٌ إِلَى المَدْرَسَةِ»، كَلِمَةُ (مُعَلِّمٌ) فِي هَذِهِ الجُمْلَةِ تُعْتَبَرُ اسْمًا:", 
            options: ["نَكِرَةً", "مَعْرِفَةً", "فِعْلًا", "حَرْفًا"], 
            answer: "نَكِرَةً", 
            exp: "لِأَنَّهَا تَدُلُّ عَلَى شَيْءٍ (شَخْصٍ) غَيْرِ مُحَدَّدٍ أَوْ مُعَيَّنٍ، وَهَذَا هُوَ تَعْرِيفُ النَّكِرَةِ." 
        },
        { 
            q: "«فَهِمَ الطَّالِبُ الدَّرْسَ»، كَلِمَةُ (الدَّرْسَ) فِي هَذِهِ الجُمْلَةِ هِيَ اسْمٌ:", 
            options: ["نَكِرَةٌ", "مَعْرِفَةٌ", "مَوْصُولٌ", "إِشَارَةٌ"], 
            answer: "مَعْرِفَةٌ", 
            exp: "لِأَنَّهَا تَدُلُّ عَلَى شَيْءٍ مُحَدَّدٍ، وَهِيَ (مُعَرَّفَةٌ بِـ أَلْ)." 
        },
        { 
            q: "مِنْ أَنْوَاعِ المَعَارِفِ (العَلَمُ)، وَهُوَ مَا يَدُلُّ عَلَى مُسَمًّى بِعَيْنِهِ مِثْلَ:", 
            options: ["مُحَمَّد، مَكَّة، رَمَضَان", "هَذَا، هَذِهِ، هَؤُلَاءِ", "الَّذِي، الَّتِي، الَّذِينَ", "الطَّبِيب، المَدْرَسَة"], 
            answer: "مُحَمَّد، مَكَّة، رَمَضَان", 
            exp: "العَلَمُ هُوَ مَا يَدُلُّ عَلَى شَخْصٍ (مُحَمَّد) أَوْ بَلَدٍ (مَكَّة) أَوْ شَهْرٍ (رَمَضَان)." 
        },
        { 
            q: "الْكَلِمَاتُ (هَذَا، هَذِهِ، هَذَانِ، هَاتَانِ، هَؤُلَاءِ) تُصَنَّفُ ضِمْنَ المَعَارِفِ بِأَنَّهَا:", 
            options: ["ضَمَائِرٌ", "أَسْمَاءُ إِشَارَةٍ", "أَسْمَاءٌ مَوْصُولَةٌ", "أَعْلَامٌ"], 
            answer: "أَسْمَاءُ إِشَارَةٍ", 
            exp: "أَسْمَاءُ الإِشَارَةِ هِيَ نَوْعٌ مِنْ أَنْوَاعِ المَعَارِفِ السِّتَّةِ كَمَا وَرَدَ فِي القَاعِدَةِ." 
        },
        { 
            q: "الْكَلِمَاتُ (الَّذِي، الَّتِي، الَّذِينَ، الَّلاتِي) تُعْتَبَرُ مِنْ أَنْوَاعِ المَعَارِفِ وَتُسَمَّى:", 
            options: ["أَسْمَاءً مَوْصُولَةً", "ضَمَائِرَ مُنْفَصِلَةً", "مُضَافًا إِلَى مَعْرِفَةٍ", "عَلَمًا"], 
            answer: "أَسْمَاءً مَوْصُولَةً", 
            exp: "الأَسْمَاءُ المَوْصُولَةُ (ومِنْهَا مَنْ، وَمَا) تُعَدُّ مِنْ أَنْوَاعِ المَعَارِفِ." 
        },
        { 
            q: "«زُرْتُ مَدِينَةَ العَرِيشِ»، كَلِمَةُ (مَدِينَةَ) هُنَا أَصْبَحَتْ مَعْرِفَةً؛ فَمَا نَوْعُهَا؟", 
            options: ["مُعَرَّفٌ بِـ (أَلْ)", "عَلَمٌ", "مُضَافٌ إِلَى اسْمٍ مَعْرِفَةٍ", "ضَمِيرٌ"], 
            answer: "مُضَافٌ إِلَى اسْمٍ مَعْرِفَةٍ", 
            exp: "كَلِمَةُ (مَدِينَة) نَكِرَةٌ فِي الأَصْلِ، لَكِنَّهَا أُضِيفَتْ إِلَى اسْمٍ مَعْرِفَةٍ عَلَمٍ وَهُوَ (العَرِيشِ) فَأَصْبَحَتْ مَعْرِفَةً." 
        },
        { 
            q: "«الضَّمَائِرُ المُنْفَصِلَةُ وَالمُتَّصِلَةُ مِثْلَ: أَنَا، أَنْتُمْ، هُنَّ، جُنُودُنَا» تُعْتَبَرُ دَائِمًا أَسْمَاءً:", 
            options: ["مَعْرِفَةً", "نَكِرَةً", "لَا مَعْرِفَةً وَلَا نَكِرَةً", "مَوْصُولَةً"], 
            answer: "مَعْرِفَةً", 
            exp: "جَمِيعُ الضَّمَائِرِ (مُنْفَصِلَةً كَانَتْ أَوْ مُتَّصِلَةً) هِيَ مِنْ أَنْوَاعِ المَعَارِفِ." 
        },
        { 
            q: "فِي جُمْلَةِ: «اشْتَرَيْتُ قِصَّةً مِنَ المَكْتَبَةِ»، أَيْنَ الاسْمُ النَّكِرَةُ؟", 
            options: ["قِصَّةً", "اشْتَرَيْتُ", "المَكْتَبَةِ", "مِنَ"], 
            answer: "قِصَّةً",

            options: ["أَنَّ، كَأَنَّ، لَكِنَّ، لَيْتَ، لَعَلَّ", "أَصْبَحَ، ظَلَّ، بَاتَ، صَارَ", "فِي، مِنْ، إِلَى، عَنْ، عَلَى", "لَمْ، لَنْ، لَا النَّاهِيَة"], 
            answer: "أَنَّ، كَأَنَّ، لَكِنَّ، لَيْتَ، لَعَلَّ", 
            exp: "هَذِهِ هِيَ الحُرُوفُ النَّاسِخَةُ الَّتِي تَنْصِبُ المُبْتَدَأَ وَتَرْفَعُ الخَبَرَ." 
        },
        { 
            q: "اخْتَرِ الصَّوَابَ: «إِنَّ التَّلَامِيذَ .............»", 
            options: ["مُجْتَهِدُونَ", "مُجْتَهِدِينَ", "مُجْتَهِدَانِ", "يُجْتَهِدُونَهُ"], 
            answer: "مُجْتَهِدُونَ", 
            exp: "لِأَنَّ (مُجْتَهِدُونَ) سَتَقَعُ خَبَرًا لِـ (إِنَّ) مَرْفُوعًا بِالوَاوِ لِأَنَّهُ جَمْعُ مُذَكَّرٍ سَالِمٌ." 
        },
        { 
            q: "صَوِّبِ الخَطَأَ النَّحْوِيَّ فِي الجُمْلَةِ التَّالِيَةِ: «إِنَّ الأُمَّهَاتُ مُضَحِّيَاتٌ»", 
            options: ["إِنَّ الأُمَّهَاتِ مُضَحِّيَاتٌ", "إِنَّ الأُمَّهَاتَ مُضَحِّيَاتٌ", "إِنَّ الأُمَّهَاتِ مُضَحِّيَاتٍ", "لَا يُوجَدُ خَطَأٌ"], 
            answer: "إِنَّ الأُمَّهَاتِ مُضَحِّيَاتٌ", 
            exp: "اسْمُ (إِنَّ) يَكُونُ مَنْصُوبًا، وَ«الأُمَّهَاتِ» جَمْعُ مُؤَنَّثٍ سَالِمٌ، فَعَلَامَةُ نَصْبِهِ هِيَ الكَسْرَةُ نِيَابَةً عَنِ الفَتْحَةِ." 
        },
        { 
            q: "اخْتَرِ الصَّوَابَ: «لَعَلَّ ......... قَادِمَانِ»", 
            options: ["المُسَافِرَيْنِ", "المُسَافِرَانِ", "المُسَافِرُونَ", "المُسَافِرِينَ"], 
            answer: "المُسَافِرَيْنِ", 
            exp: "نَحْتَاجُ إِلَى مُثَنًّى مَنْصُوبٍ لِيَكُونَ اسْمًا لِـ(لَعَلَّ)، وَعَلَامَةُ نَصْبِ المُثَنَّى هِيَ اليَاءُ: (المُسَافِرَيْنِ)." 
        },
        { 
            q: "صَوِّبِ الخَطَأَ النَّحْوِيَّ هُنَا: «لَيْتَهُ شُجَاعًا»", 
            options: ["لَيْتَهُ شُجَاعٌ", "لَيْتَهُ الشُّجَاعُ", "لَيْتَ شُجَاعٌ هُوَ", "لَا يُوجَدُ خَطَأٌ"], 
            answer: "لَيْتَهُ شُجَاعٌ", 
            exp: "الضَّمِيرُ (الهاء) هُوَ اسْمُ (لَيْتَ)، وَ«شُجَاعٌ» هُوَ الخَبَرُ وَيَجِبُ أَنْ يَكُونَ مَرْفُوعًا بِالضَّمَّةِ." 
        },
        { 
            q: "أَدْخِلْ (إِنَّ) عَلَى الجُمْلَةِ التَّالِيَةِ وَغَيِّرْ مَا يَلْزَمُ: «فُوكَ نَظِيفٌ»", 
            options: ["إِنَّ فَاكَ نَظِيفٌ", "إِنَّ فِيكَ نَظِيفٌ", "إِنَّ فُوكَ نَظِيفًا", "إِنَّ فَاكَ نَظِيفًا"], 
            answer: "إِنَّ فَاكَ نَظِيفٌ", 
            exp: "اسْمُ إِنَّ مَنْصُوبٌ، وَالأَسْمَاءُ الخَمْسَةُ تُنْصَبُ بِالأَلِفِ (فَاكَ)، وَيَبْقَى الخَبَرُ مَرْفُوعًا (نَظِيفٌ)." 
        },
        { 
            q: "مَا نَوْعُ الخَبَرِ لِلْحَرْفِ النَّاسِخِ فِي جُمْلَةِ: «لَعَلَّ المُسَافِرِينَ حَقَائِبُهُمْ جَاهِزَةٌ»؟", 
            options: ["جُمْلَةٌ اسْمِيَّةٌ", "مُفْرَدٌ", "جُمْلَةٌ فِعْلِيَّةٌ", "شِبْهُ جُمْلَةٍ"], 
            answer: "جُمْلَةٌ اسْمِيَّةٌ", 
            exp: "خَبَرُ (لَعَلَّ) هُنَا يَتَكَوَّنُ مِنْ (حَقَائِبُهُمْ جَاهِزَةٌ)، وَهِيَ جُمْلَةٌ اسْمِيَّةٌ تَتَضَمَّنُ رَابِطًا (هُمْ)." 
        },
        { 
            q: "مَا نَوْعُ الخَبَرِ فِي جُمْلَةِ: «كَأَنَّ زَائِرَ المُتْحَفِ فِي حُلْمٍ»؟", 
            options: ["شِبْهُ جُمْلَةٍ (جَارٌّ وَمَجْرُورٌ)", "مُفْرَدٌ", "شِبْهُ جُمْلَةٍ (ظَرْفٌ)", "جُمْلَةٌ اسْمِيَّةٌ"], 
            answer: "شِبْهُ جُمْلَةٍ (جَارٌّ وَمَجْرُورٌ)", 
            exp: "الخَبَرُ الَّذِي أَتَمَّ المَعْنَى هُوَ (فِي حُلْمٍ)، وَهُوَ مُكَوَّنٌ مِنْ حَرْفِ جَرٍّ وَاسْمٍ مَجْرُورٍ، إِذَنْ هُوَ شِبْهُ جُمْلَةٍ." 
        },
        { 
            q: "خَبَرُ الحُرُوفِ النَّاسِخَةِ (إِنَّ وَأَخَوَاتِهَا) حِينَمَا يَكُونُ جُمْلَةً أَوْ شِبْهَ جُمْلَةٍ يُعْرَبُ دَائِمًا فِي مَحَلِّ:", 
            options: ["رَفْعٍ", "نَصْبٍ", "جَرٍّ", "جَزْمٍ"], 
            answer: "رَفْعٍ", 
            exp: "بِمَا أَنَّ الخَبَرَ الأَصْلِيَّ لِإِنَّ وَأَخَوَاتِهَا مَرْفُوعٌ، فَإِنَّ الجُمْلَةَ أَو شِبْهَ الجُمْلَةِ تَحُلُّ مَحَلَّهُ وَتَكُونُ فِي (مَحَلِّ رَفْعٍ)." 
        },
        { 
            q: "أَعْرِبْ كَلِمَةَ (غِذَاءُ) فِي جُمْلَةِ: «إِنَّ القِرَاءَةَ غِذَاءُ العُقُولِ»", 
            options: ["خَبَرُ إِنَّ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ", "مُبْتَدَأٌ مَرْفُوعٌ", "اسْمُ إِنَّ مَنْصُوبٌ", "مُضَافٌ إِلَيْهِ مَجْرُورٌ"], 
            answer: "خَبَرُ إِنَّ مَرْفُوعٌ وَعَلَامَةُ رَفْعِهِ الضَّمَّةُ", 
            exp: "«القِرَاءَةَ» هِيَ اسْمُ إِنَّ، وَ«غِذَاءُ» هِيَ الخَبَرُ الَّذِي أَتَمَّ المَعْنَى وَهُوَ مُفْرَدٌ مَرْفُوعٌ بِالضَّمَّةِ." 
        },
        { 
            q: "فِي جُمْلَةِ «عَلِمْتُ أَنَّ الأَرْضَ تَدُورُ»، مَا المَوْقِعُ الإِعْرَابِيُّ لِلْجُمْلَةِ الفِعْلِيَّةِ (تَدُورُ)؟", 
            options: ["فِي مَحَلِّ رَفْعِ خَبَرِ أَنَّ", "فِي مَحَلِّ نَصْبِ خَبَرِ أَنَّ", "فِي مَحَلِّ رَفْعِ اسْمِ أَنَّ", "فَاعِلٌ مَرْفُوعٌ"], 
            answer: "فِي مَحَلِّ رَفْعِ خَبَرِ أَنَّ", 
            exp: "«الأَرْضَ» هِيَ اسْمُ (أَنَّ) مَنْصُوبٌ، وَالجُمْلَةُ الفِعْلِيَّةُ (تَدُورُ) أَكْمَلَتِ المَعْنَى فَوَقَعَتْ فِي مَحَلِّ رَفْعِ خَبَرِ الحَرْفِ النَّاسِخِ." 
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let userAnswersData = [];

    function shuffleArray(array) {
        let currentIndex = array.length, randomIndex;
        while (currentIndex !== 0) {
            randomIndex = Math.floor(Math.random() * currentIndex);
            currentIndex--;
            [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
        }
        return array;
    }

    function toArabicNumeral(n) {
        const arabicNumbers = ['٠', '١', '٢', '٣', '٤', '٥', '٦', '٧', '٨', '٩'];
        return n.toString().split('').map(char => arabicNumbers[char] || char).join('');
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.remove('active');
        });
        document.getElementById(screenId).classList.add('active');
    }

    function startQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        userAnswersData = [];
        // No global shuffling of `allQuestions` requested to maintain topic order grouping? 
        // We will keep them in order of grammar lessons, but shuffle options.
        showScreen('screen-quiz');
        loadQuestion();
    }

    function loadQuestion() {
        const questionData = allQuestions[currentQuestionIndex];
        
        const percent = ((currentQuestionIndex) / allQuestions.length) * 100;
        document.getElementById('progress-bar').style.width = percent + '%';
        document.getElementById('progress-text').innerText = `السُّؤَالُ ${toArabicNumeral(currentQuestionIndex + 1)} / ${toArabicNumeral(allQuestions.length)}`;
        document.getElementById('progress-percent').innerText = `${toArabicNumeral(Math.round(percent))}٪`;

        document.getElementById('question-text').innerText = questionData.q;

        document.getElementById('feedback-container').style.display = 'none';

        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';
        
        let shuffledOptions = [...questionData.options];
        
        if (shuffledOptions.length > 2) {
            shuffleArray(shuffledOptions);
        }

        shuffledOptions.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt;
            btn.onclick = () => selectOption(btn, opt, questionData);
            optionsContainer.appendChild(btn);
        });

        const nextBtn = document.getElementById('btn-next');
        if (currentQuestionIndex === allQuestions.length - 1) {
            nextBtn.innerText = "إِنْهَاءُ الِاخْتِبَارِ";
        } else {
            nextBtn.innerText = "السُّؤَالُ التَّالِي";
        }
    }

    function selectOption(selectedBtn, selectedText, questionData) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.disabled = true);

        const isCorrect = (selectedText === questionData.answer);
        
        userAnswersData.push({
            q: questionData.q,
            userAns: selectedText,
            correctAns: questionData.answer,
            isCorrect: isCorrect
        });

        if (isCorrect) {
            score++;
            selectedBtn.classList.add('correct');
            showFeedback(true, questionData.exp);
        } else {
            selectedBtn.classList.add('wrong');
            allBtns.forEach(btn => {
                if (btn.innerText === questionData.answer) {
                    btn.classList.add('correct');
                }
            });
            showFeedback(false, questionData.exp);
        }
    }

    function showFeedback(isCorrect, explanation) {
        const feedbackContainer = document.getElementById('feedback-container');
        const feedbackMessage = document.getElementById('feedback-message');
        const feedbackExp = document.getElementById('feedback-explanation');

        feedbackContainer.style.display = 'flex';
        
        if (isCorrect) {
            feedbackMessage.innerText = "إِجَابَةٌ صَحِيحَةٌ ✓";
            feedbackMessage.style.color = "var(--green)";
        } else {
            feedbackMessage.innerText = "إِجَابَةٌ خَاطِئَةٌ ✗";
            feedbackMessage.style.color = "var(--red)";
        }
        
        feedbackExp.innerText = explanation;
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < allQuestions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        document.getElementById('progress-bar').style.width = '100%';
        
        const percentage = Math.round((score / allQuestions.length) * 100);
        document.getElementById('score-text').innerText = `${toArabicNumeral(score)}/${toArabicNumeral(allQuestions.length)}`;
        document.getElementById('percentage-text').innerText = `${toArabicNumeral(percentage)}٪`;

        const evalText = document.getElementById('evaluation-text');
        if (percentage >= 90) {
            evalText.innerText = "عَبْقَرِيٌّ! أَنْتَ مُتَمَكِّنٌ مِنْ جَمِيعِ القَوَاعِدِ النَّحْوِيَّةِ.";
            evalText.style.color = "var(--green)";
        } else if (percentage >= 80) {
            evalText.innerText = "جَيِّدٌ جِدًّا، مُسْتَوَاكَ مُرْتَفِعٌ!";
            evalText.style.color = "var(--green)";
        } else if (percentage >= 70) {
            evalText.innerText = "جَيِّدٌ، لَكِنْ لَا تَنْسَ مُرَاجَعَةَ بَعْضِ القَوَاعِدِ.";
            evalText.style.color = "var(--secondary)";
        } else {
            evalText.innerText = "تَحْتَاجُ إِلَى مُرَاجَعَةِ كِتَابِ القَوَاعِدِ مَرَّةً أُخْرَى.";
            evalText.style.color = "var(--red)";
        }

        showScreen('screen-result');
    }

    function showReview() {
        const reviewList = document.getElementById('review-list');
        reviewList.innerHTML = '';

        userAnswersData.forEach((item, index) => {
            const reviewItem = document.createElement('div');
            reviewItem.className = 'review-item';
            
            let ansHtml = '';
            if (item.isCorrect) {
                ansHtml = `<div class="text-green">إِجَابَتُكَ: ${item.userAns} ✓</div>`;
            } else {
                ansHtml = `
                    <div class="text-red">إِجَابَتُكَ: ${item.userAns} ✗</div>
                    <div class="text-green">الإِجَابَةُ الصَّحِيحَةُ: ${item.correctAns}</div>
                `;
            }

            reviewItem.innerHTML = `
                <div class="review-q">${toArabicNumeral(index + 1)}. ${item.q}</div>
                <div class="review-ans">${ansHtml}</div>
            `;
            reviewList.appendChild(reviewItem);
        });

        showScreen('screen-review');
    }

    function restartQuiz() {
        showScreen('screen-start');
    }

</script>
