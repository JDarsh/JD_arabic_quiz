<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اخْتِبَارٌ تَفَاعُلِيّ - كَنْزٌ لَا يُقَدَّرُ بِثَمَنٍ</title>
    <style>
        :root {
            --primary: #92400e; /* Amber 800 */
            --secondary: #fbbf24; /* Amber 400 */
            --white: #ffffff;
            --green: #10b981;
            --red: #ef4444;
            --text-dark: #1e1b4b;
        }

        body { margin: 0; padding: 0; background-color: #020617; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
        
        #app-container { background-color: var(--primary); color: var(--white); width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.9); display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; }

        .screen { display: none; flex-direction: column; width: 100%; height: 100%; padding: 4vh 5vw; box-sizing: border-box; }
        .screen.active { display: flex; }

        /* Start Screen */
        .start-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: 6.5vh; color: var(--secondary); margin: 0 0 2vh 0; text-shadow: 3px 3px 6px rgba(0,0,0,0.4); }
        .btn-large { background-color: var(--secondary); color: var(--text-dark); font-size: 5vh; font-weight: bold; padding: 2vh 6vw; border: none; border-radius: 50px; cursor: pointer; transition: transform 0.1s; }
        .btn-large:active { transform: scale(0.95); }

        /* Quiz Screen */
        .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 3vh; font-weight: bold; margin-bottom: 2vh; color: var(--secondary); }
        .progress-container { width: 100%; height: 2vh; background: rgba(255,255,255,0.2); border-radius: 20px; overflow: hidden; margin-bottom: 4vh; }
        .progress-bar { height: 100%; background-color: var(--secondary); width: 0%; transition: width 0.3s; }
        .question-text { font-size: 4.5vh; font-weight: bold; text-align: center; margin-bottom: 4vh; flex: 1; display: flex; align-items: center; justify-content: center; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vh; margin-bottom: 4vh; }
        .option-btn { background: var(--white); color: var(--text-dark); font-size: 3.5vh; font-weight: bold; padding: 2vh; border-radius: 15px; cursor: pointer; border: none; transition: all 0.2s; }
        .option-btn:disabled { opacity: 0.8; }
        .option-btn.correct { background: var(--green); color: var(--white); }
        .option-btn.wrong { background: var(--red); color: var(--white); }
        .feedback-container { display: none; flex-direction: column; align-items: center; background: rgba(0,0,0,0.3); padding: 2vh; border-radius: 15px; }

        /* Result & Review */
        .result-container { display: flex; flex-direction: column; justify-content: center; align-items: center; flex: 1; text-align: center; }
        .review-list { flex: 1; overflow-y: auto; padding-right: 2vw; width: 100%; }
        .review-item { background: rgba(0,0,0,0.2); padding: 2vh; margin-bottom: 2vh; border-radius: 10px; border-right: 1vh solid var(--secondary); text-align: right; }
        .text-green { color: var(--green); } .text-red { color: var(--red); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="screen-start" class="screen active">
        <div class="start-content">
            <h1>دَرْسُ: كَنْزٌ لَا يُقَدَّرُ بِثَمَنٍ</h1>
            <button class="btn-large" onclick="startQuiz()">ابدأ الاختبار</button>
        </div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="top-bar">
            <div id="progress-text">السُّؤَالُ ١ / ٣٠</div>
            <div id="progress-percent">٠٪</div>
        </div>
        <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="question-text" class="question-text"></div>
        <div id="options-container" class="options-grid"></div>
        <div id="feedback-container" class="feedback-container">
            <div id="feedback-message" style="font-size: 4vh; font-weight: bold;"></div>
            <div id="feedback-explanation" style="font-size: 3vh; margin: 1vh 0;"></div>
            <button class="btn-next" onclick="nextQuestion()" style="background: var(--secondary); border: none; padding: 1vh 3vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">السؤال التالي</button>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <div class="result-container">
            <h1>نتيجة الاختبار</h1>
            <div id="score-text" style="font-size: 10vh;">٠/٣٠</div>
            <div style="display:flex; gap:2vh;">
                <button onclick="showReview()" style="padding: 1vh 2vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">مراجعة الإجابات</button>
                <button onclick="restartQuiz()" style="padding: 1vh 2vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">إعادة الاختبار</button>
            </div>
        </div>
    </div>

    <div id="screen-review" class="screen">
        <div style="margin-bottom: 2vh;"><h2 style="color: var(--secondary);">مراجعة الإجابات</h2></div>
        <div id="review-list" class="review-list"></div>
        <button class="btn-next" onclick="showScreen('screen-result')" style="padding: 1vh 3vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">العودة للنتيجة</button>
    </div>
</div>

<script>
    const questions = [
        { q: "مَا هُوَ الْمَبْلَغُ الَّذِي وَرَدَ فِي الرِّسَالَةِ التَّخَيُّلِيَّةِ؟", options: ["٨٦,٤٠٠ جُنَيْهٍ", "٨٦٠,٠٠٠ جُنَيْهٍ", "٨٦,٠٠٠ جُنَيْهٍ", "٤٠,٨٦٠ جُنَيْهٍ"], answer: "٨٦,٤٠٠ جُنَيْهٍ", exp: "وَردَ فِي الرِّسَالَةِ مَبْلَغُ ٨٦,٤٠٠ جُنَيْهٍ." },
        { q: "مَا الشَّرْطُ الَّذِي وَضَعَتْهُ الرِّسَالَةُ التَّخَيُّلِيَّةُ؟", options: ["إِنْفَاقُهُ قَبْلَ نِهَايَةِ الْيَوْمِ", "تَوْفِيرُهُ لِلسَّنَةِ القَادِمَةِ", "التَّبَرُّعُ بِهِ كُلِّهِ", "شِرَاءُ ذَهَبٍ بِهِ"], answer: "إِنْفَاقُهُ قَبْلَ نِهَايَةِ الْيَوْمِ", exp: "كَانَ الشَّرْطُ إِنْفَاقَهُ قَبْلَ نِهَايَةِ الْيَوْمِ أَوْ سَيَخْتَفِي." },
        { q: "مَا الفَارِقُ الَّذِي ذَكَرَهُ الكَاتِبُ بَيْنَ الْمَالِ وَالْوَقْتِ؟", options: ["الْمَالُ يَعُودُ أَمَّا الوَقْتُ فَلَا يَعُودُ", "الوَقْتُ يَعُودُ أَمَّا الْمَالُ فَلَا", "كِلَاهُمَا لَا يَعُودَانِ", "كِلَاهُمَا يَعُودَانِ"], answer: "الْمَالُ يَعُودُ أَمَّا الوَقْتُ فَلَا يَعُودُ", exp: "أَكَّدَ الكَاتِبُ أَنَّ المَالَ يُمْكِنُ أَنْ تَعُوضَهُ، لَكِنَّ الوَقْتَ إِذَا ضَاعَ فَلَا يَعُودُ." },
        { q: "مَا هِيَ «الإِشَارَةُ الحَمْرَاءُ» الَّتِي يُحَذِّرُ مِنْهَا الدَّرْسُ فِي حَيَاتِنَا؟", options: ["التَّأْجِيلُ وَالتَّشَتُّتُ", "الْمُذَاكَرَةُ الْجَيِّدَةُ", "تَنْظِيمُ الْوَقْتِ", "الرِّياضَةُ"], answer: "التَّأْجِيلُ وَالتَّشَتُّتُ", exp: "حَذَّرَ الدَّرْسُ مِنْ أَنَّ التَّأْجِيلَ وَالتَّشَتُّتَ هُمَا أَخْطَرُ أَعْدَاءِ الْوَقْتِ." },
        { q: "مَاذَا يَقُولُ الْمَثَلُ العَرَبِيُّ عَنِ الْوَقْتِ؟", options: ["الْوَقْتُ مِنْ ذَهَبٍ إِنْ لَمْ تُدْرِكْهُ ذَهَبَ", "الْوَقْتُ كَالسَّيْفِ", "الوقتُ كَنْزٌ", "لَا تُؤَجِّلْ عَمَلَ الْيَوْمِ"], answer: "الْوَقْتُ مِنْ ذَهَبٍ إِنْ لَمْ تُدْرِكْهُ ذَهَبَ", exp: "هَذَا هُوَ الْمَثَلُ الْعَرَبِيُّ الَّذِي أَوْرَدَهُ الكَاتِبُ لِيُبَيِّنَ أَهَمِّيَّةَ الوقت." },
        { q: "كَيْفَ يَعِيشُ الْأَذْكِيَاءُ زَمَانَهُمْ؟", options: ["فِي سِبَاقٍ مَعَ الزَّمَنِ وَيَفُوزُونَ بِتَخْطِيطِ يَوْمِهِمْ", "فِي رَاحَةٍ تَّامَّةٍ", "بِتَجَاهُلِ الْمَهَامِّ", "بِالنَّوْمِ كَثِيرًا"], answer: "فِي سِبَاقٍ مَعَ الزَّمَنِ وَيَفُوزُونَ بِتَخْطِيطِ يَوْمِهِمْ", exp: "الْأَذْكِيَاءُ هُمُ الَّذِينَ يُخَطِّطُونَ لِأَوْقَاتِهِمْ وَيُدِيرُونَهَا بِحِكْمَةٍ." },
        { q: "مَاذا يَعْنِي التَّخْطِيطُ لِلْيَوْمِ كَمَا يَرَى الدَّرْسُ؟", options: ["أَنْ نُدِيرَ كَنْزًا لَا يُقَدَّرُ بِثَمَنٍ", "أَنْ نَقْضِيَ الوَقْتَ فِي اللَّعِبِ", "أَنْ نَنْتَظِرَ الحَظَّ", "أَنْ نُؤَجِّلَ كُلَّ شَيْءٍ"], answer: "أَنْ نُدِيرَ كَنْزًا لَا يُقَدَّرُ بِثَمَنٍ", exp: "التَّخْطِيطُ هُوَ طَرِيقَةُ إِدَارَةِ هَذَا الكَنْزِ (الوَقْت) بِشَكْلٍ صَحِيحٍ." },
        { q: "مَاذَا يَجِبُ عَلَيْنَا أَنْ نُرَتِّبَ فِي خُطَّتِنَا اليَوْمِيَّةِ؟", options: ["الْأَوْلَوِيَّاتِ مِنَ الْأَهَمِّ فَالْأَقَلِّ", "الألعاب فقط", "اللعب قبل المذاكرة", "لا نُرَتِّبُ شيئًا"], answer: "الْأَوْلَوِيَّاتِ مِنَ الْأَهَمِّ فَالْأَقَلِّ", exp: "تَرْتِيبُ الأَوْلَوِيَّاتِ ضَرُورِيٌّ لِتَحْقِيقِ أَقْصَى اسْتِفَادَةٍ مِنَ الوَقْتِ." },
        { q: "مَا هِيَ القَاعِدَةُ الذَّهَبِيَّةُ لِاتِّخَاذِ أَيِّ قَرَارٍ؟", options: ["هَلْ هَذَا الْقَرَارُ سَيُفِيدُنِي دَائِمًا أَمْ سَيُعْطِينِي رَاحَةً مُؤَقَّتَةً", "هَلْ هَذَا الْقَرَارُ سَهْلٌ؟", "هَلْ سَيُعْجِبُ الْآخَرِينَ؟", "هَلْ هُوَ غَالٍ؟"], answer: "هَلْ هَذَا الْقَرَارُ سَيُفِيدُنِي دَائِمًا أَمْ سَيُعْطِينِي رَاحَةً مُؤَقَّتَةً", exp: "يَجِبُ أَنْ نُفَكِّرَ فِي العَوَاقِبِ بَعِيدَةِ المَدَى قَبْلَ اتِّخَاذِ القَرَارِ." },
        { q: "كَيْفَ نُحَقِّقُ التَّوَازُنَ فِي حَيَاتِنَا؟", options: ["بِتَقْسِيمِ الوَقْتِ بَيْنَ الدِّرَاسَةِ وَالْهِوَايَاتِ", "بِالرَّكِيزِ عَلَى الدِّرَاسَةِ فَقَطْ", "بِتَرْكِ الدِّرَاسَةِ وَالْعَمَلِ", "بِاللَّعِبِ طَوَالَ الْيَوْمِ"], answer: "بِتَقْسِيمِ الوَقْتِ بَيْنَ الدِّرَاسَةِ وَالْهِوَايَاتِ", exp: "التَّوَازُنُ ضَرُورِيٌّ لِتَجَنُّبِ المَلَلِ وَلِضَمَانِ الصِّحَّةِ النَّفْسِيَّةِ." },
        { q: "مَا مَعْنَى كَلِمَةِ «إِيدَاع»؟", options: ["وَضْعُ الْمَالِ فِي الحِسَابِ", "صَرْفُ الْمَالِ", "سَرِقَةُ الْمَالِ", "إِخْفَاءُ الْمَالِ"], answer: "وَضْعُ الْمَالِ فِي الحِسَابِ", exp: "إِيدَاعٌ يَعْنِي وَضْعَ الْمَالِ أَمَانَةً فِي الْمَصْرِفِ." },
        { q: "مَا مَعْنَى كَلِمَةِ «يُدْرِكُهُ»؟", options: ["يَلْحَقُهُ وَيَسْتَثْمِرُهُ", "يَفْقِدُهُ", "يَرَى سَرِيعًا", "يُؤَجِّلُهُ"], answer: "يَلْحَقُهُ وَيَسْتَثْمِرُهُ", exp: "أَدْرَكَ الشَّيْءَ أَي لَحِقَ بِهِ وَأَمْسَكَ بِهِ." },
        { q: "مَاذَا يَحْدُثُ عِنْدَمَا نُخَطِّطُ لِيَوْمِنَا؟", options: ["نُصْبِحُ أَكْثَرَ إِنْتَاجِيَّةً", "يَضِيعُ الوَقْتُ", "نَشْعُرُ بِالْفَوْضَى", "يَزْدَادُ التَّأْجِيلُ"], answer: "نُصْبِحُ أَكْثَرَ إِنْتَاجِيَّةً", exp: "التَّخْطِيطُ يُؤَدِّي إِلَى التَّنْظِيمِ وَزِيَادَةِ الإِنْتَاجِ." },
        { q: "مَا هِيَ العِبَارَةُ المَأْثُورَةُ عَنْ التَّأْجِيلِ؟", options: ["لَا تُؤَجِّلْ عَمَلَ الْيَوْمِ إِلَى الْغَدِ", "الوَقْتُ كَالسَّيْفِ", "الْعِلْمُ نُورٌ", "مَنْ جَدَّ وَجَدَ"], answer: "لَا تُؤَجِّلْ عَمَلَ الْيَوْمِ إِلَى الْغَدِ", exp: "هَذَا مَثَلٌ عَرَبِيٌّ يَحُثُّ عَلَى إِنجَازِ المَهَامِّ فِي وَقْتِهَا." },
        { q: "مَا الَّذِي يَجِبُ أَنْ نَفْعَلَهُ فِي نِهَايَةِ كُلِّ يَوْمٍ؟", options: ["نُحَاسِبُ أَنْفُسَنَا وَنُقَيِّمُ مَا أَنْجَزْنَاهُ", "نَنَامُ مُبَاشَرَةً", "لَا نَفْعَلُ شَيْئًا", "نُخَطِّطُ لِلسَّفَرِ"], answer: "نُحَاسِبُ أَنْفُسَنَا وَنُقَيِّمُ مَا أَنْجَزْنَاهُ", exp: "المُحَاسَبَةُ اليَوْمِيَّةُ تُسَاعِدُنَا عَلَى التَّحَسُّنِ غَدًا." },
        { q: "كُلَّ ثَانِيَةٍ تَمُرُّ هِيَ:", options: ["فُرْصَةٌ جَدِيدَةٌ لِلتَّعَلُّمِ", "وَقْتٌ ضَائِعٌ", "بِدَايَةُ فَنَاءٍ", "لَا مَعْنَى لَهَا"], answer: "فُرْصَةٌ جَدِيدَةٌ لِلتَّعَلُّمِ", exp: "كُلُّ ثَانِيَةٍ فُرْصَةٌ لِلتَّطَوُّرِ." },
        { q: "السِّرُّ فِي الفَوْزِ فِي سِبَاقِ الزَّمَنِ هُوَ:", options: ["التَّخْطِيطُ الْجَيِّدُ", "السُّرْعَةُ بِدُونِ تَفْكِيرٍ", "إِضَاعَةُ الوَقْتِ", "الاعْتِمَادُ عَلَى الصُّدْفَةِ"], answer: "التَّخْطِيطُ الْجَيِّدُ", exp: "التَّخْطِيطُ هُوَ المِفْتَاحُ." },
        { q: "مَاذَا يَعْنِي التَّشَتُّتُ؟", options: ["فِقْدَانُ التَّرْكِيزِ", "الْعَمَلُ بِنَشَاطٍ", "تَحْدِيدُ الأَهْدَافِ", "تَنْظِيمُ المَهَامِّ"], answer: "فِقْدَانُ التَّرْكِيزِ", exp: "التَّشَتُّتُ يَمْنَعُ الإِنجَازَ لِأَنَّهُ يُفْقِدُنَا التَّرْكِيزَ." },
        { q: "هَلْ نُحَاسِبُ أَنْفُسَنَا لِيَكُونَ الغَدُ أَفْضَلَ؟", options: ["نَعَمْ، لِأَنَّه يُسَاعِدُنا عَلَى تَحْسِينِ الأَدَاءِ", "لَا، لِأَنَّ الغَدَ لَا يَهُمُّ", "لَا، لِأَنَّنا نَعْرِفُ كُلَّ شَيْءٍ", "لَا، هَذَا تَضْيِيعٌ لِلوَقْتِ"], answer: "نَعَمْ، لِأَنَّه يُسَاعِدُنا عَلَى تَحْسِينِ الأَدَاءِ", exp: "المُحَاسَبَةُ ضَرُورِيَّةٌ لِلتَّطَوُّرِ." },
        { q: "التَّحَكُّمُ فِي الوَقْتِ بَدَلًا مِنْ أَنْ يَتَحَكَّمَ هُوَ فِينَا يُعَدُّ:", options: ["إِدَارَةً حَكِيمَةً لِلْوَقْتِ", "تَضْيِيعًا لِلْوَقْتِ", "أَمْرًا مُسْتَحِيلًا", "إِهْمَالًا"], answer: "إِدَارَةً حَكِيمَةً لِلْوَقْتِ", exp: "الشَّخْصُ النَّاجِحُ هُوَ مَنْ يَسُودُ وَيُدِيرُ وَقْتَهُ." },

        { q: "الوَقْتُ يُمْكِنُ تَعْوِيضُهُ إِذَا ضَاعَ مِثْلَ المَالِ.", options: ["صواب", "خطأ"], answer: "خطأ", exp: "خطأ، المال يعود والوقت لا يعود." },
        { q: "تَخْطِيطُ يَوْمِنَا يُسَاعِدُنَا عَلَى الاسْتِفَادَةِ مِنْ كُلِّ جُزْءٍ فِيهِ.", options: ["صواب", "خطأ"], answer: "صواب", exp: "صواب، التخطيط ينظم حياتنا." },
        { q: "التَّأْجِيلُ هُوَ مِنْ أَهَمِّ أَعْدَاءِ الوَقْتِ الَّذِي يَجِبُ تَجَنُّبُهُ.", options: ["صواب", "خطأ"], answer: "صواب", exp: "صواب، التأجيل يضيع الفرص." },
        { q: "يَنْبَغِي عَلَيْنَا تَرْكُ الهِوَايَاتِ تَمَامًا لِتَحْقِيقِ التَّفَوقِ الدِّرَاسِيِّ.", options: ["صواب", "خطأ"], answer: "خطأ", exp: "خطأ، التَّوَازُنُ بَيْنَ الدِّرَاسَةِ وَالهِوَايَةِ ضَرُورِيٌّ." },
        { q: "يُعْتَبَرُ التَّشَتُّتُ أَمْرًا مُفِيدًا لِأَنَّهُ يُعَلِّمُنَا القِيَامَ بِأَعْمَالٍ مُتَعَدِّدَةٍ.", options: ["صواب", "خطأ"], answer: "خطأ", exp: "خطأ، التشتت يفقدنا التركيز والإنتاجية." },
        { q: "كُلُّ ثَانِيَةٍ تَمُرُّ هِيَ فُرْصَةٌ لِلتَّطَوُّرِ وَالاقْتِرَابِ مِنَ الْأَحْلَامِ.", options: ["صواب", "خطأ"], answer: "صواب", exp: "صواب، يجب استغلال كل لحظة." },
        { q: "الأَذْكِيَاءُ هُمُ الَّذِينَ يَفُوزُونَ فِي سِبَاقِهِمْ مَعَ الزَّمَنِ.", options: ["صواب", "خطأ"], answer: "صواب", exp: "صواب، لأنهم يديرون وقتهم ككنز." },
        { q: "الْحِكْمَةُ القَدِيمَةُ تَقُولُ: (الْوَقْتُ مِنْ ذَهَبٍ إِنْ لَمْ تُدْرِكْهُ ذَهَبَ).", options: ["صواب", "خطأ"], answer: "صواب", exp: "صواب، هذه الحكمة تؤكد أهمية الوقت." },
        { q: "مُحَاسَبَةُ أَنْفُسِنَا فِي نِهَايَةِ اليَوْمِ أَمْرٌ غَيْرُ ضَرُورِيٍّ.", options: ["صواب", "خطأ"], answer: "خطأ", exp: "خطأ، محاسبة النفس تقوّم السلوك وتُحسن الأداء." },
        { q: "الْمَالُ أَغْلَى مِنْ كَنْزِ الْوَقْتِ لِأَنَّهُ يُمْكِنُ أَنْ يَشْتَرِيَ كُلَّ شَيْءٍ.", options: ["صواب", "خطأ"], answer: "خطأ", exp: "خطأ، الوقت كنز لا يُقَدَّرُ بِثَمَنٍ ولا يُشترَى بالمال." }
    ];

    let currentQ = 0, score = 0, userAnswers = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz() { currentQ = 0; score = 0; userAnswers = []; showScreen('screen-quiz'); loadQ(); }
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function loadQ() {
        let q = questions[currentQ];
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('progress-bar').style.width = (currentQ/questions.length)*100 + "%";
        document.getElementById('progress-text').innerText = `السُّؤَالُ ${toArabicNumeral(currentQ + 1)} / ${toArabicNumeral(questions.length)}`;
        
        let container = document.getElementById('options-container'); 
        container.innerHTML = '';
        document.getElementById('feedback-container').style.display = 'none';
        
        let optionsArr = [...q.options];
        shuffleArray(optionsArr);
        
        optionsArr.forEach(opt => {
            let btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt;
            btn.onclick = () => {
                document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                let isCorrect = (opt === q.answer);
                if(isCorrect) { score++; btn.classList.add('correct'); document.getElementById('feedback-message').innerText = "إِجَابَةٌ صَحِيحَةٌ ✓"; }
                else { btn.classList.add('wrong'); document.querySelectorAll('.option-btn').forEach(b => { if(b.innerText === q.answer) b.classList.add('correct'); }); document.getElementById('feedback-message').innerText = "إِجَابَةٌ خَاطِئَةٌ ✗"; }
                document.getElementById('feedback-explanation').innerText = q.exp;
                document.getElementById('feedback-container').style.display = 'flex';
                userAnswers.push({q: q.q, ans: opt, correct: q.answer, isCorrect: isCorrect});
            };
            container.appendChild(btn);
        });
    }
    function nextQuestion() { 
        currentQ++; 
        if(currentQ < questions.length) loadQ(); 
        else { 
            document.getElementById('score-text').innerText = toArabicNumeral(score) + "/٣٠"; 
            showScreen('screen-result'); 
        } 
    }
    function toArabicNumeral(n) { return n.toString().split('').map(c => '٠١٢٣٤٥٦٧٨٩'[c] || c).join(''); }
    function restartQuiz() { showScreen('screen-start'); }
    function showReview() {
        let list = document.getElementById('review-list'); list.innerHTML = '';
        userAnswers.forEach((a, i) => {
            let item = document.createElement('div');
            item.className = 'review-item';
            item.innerHTML = `<div class="review-q">${toArabicNumeral(i+1)}. ${a.q}</div>
            <div class="${a.isCorrect ? 'text-green' : 'text-red'}">إجابتك: ${a.ans} ${a.isCorrect ? '✓' : '✗'}</div>
            ${!a.isCorrect ? `<div class="text-green">الإجابة الصحيحة: ${a.correct}</div>` : ''}`;
            list.appendChild(item);
        });
        showScreen('screen-review');
    }
</script>
