<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اخْتِبَارٌ تَفَاعُلِيّ - إِلَى الشَّبَابِ</title>
    <style>
        :root {
            --primary: #831843; --secondary: #fbbf24; --white: #ffffff;
            --green: #10b981; --red: #ef4444; --text-dark: #1e1b4b;
        }
        body { margin: 0; padding: 0; background-color: #020617; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
        
        #app-container { background-color: var(--primary); color: var(--white); width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.9); display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; }

        .screen { display: none; flex-direction: column; width: 100%; height: 100%; padding: 4vh 5vw; box-sizing: border-box; }
        .screen.active { display: flex; }

        .start-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: 6.5vh; color: var(--secondary); margin: 0 0 2vh 0; text-shadow: 3px 3px 6px rgba(0,0,0,0.4); }
        .btn-large { background-color: var(--secondary); color: var(--text-dark); font-size: 5vh; font-weight: bold; padding: 2vh 6vw; border: none; border-radius: 50px; cursor: pointer; transition: transform 0.1s; }
        .btn-large:active { transform: scale(0.95); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 3vh; font-weight: bold; margin-bottom: 2vh; color: var(--secondary); }
        .progress-container { width: 100%; height: 2vh; background: rgba(255,255,255,0.2); border-radius: 20px; overflow: hidden; margin-bottom: 4vh; }
        .progress-bar { height: 100%; background-color: var(--secondary); width: 0%; transition: width 0.3s; }
        .question-text { font-size: 4vh; font-weight: bold; text-align: center; margin-bottom: 4vh; flex: 1; display: flex; align-items: center; justify-content: center; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vh; margin-bottom: 4vh; }
        .option-btn { background: var(--white); color: var(--text-dark); font-size: 3vh; font-weight: bold; padding: 2vh; border-radius: 15px; cursor: pointer; border: none; transition: all 0.2s; }
        .option-btn.correct { background: var(--green); color: var(--white); }
        .option-btn.wrong { background: var(--red); color: var(--white); }
        .feedback-container { display: none; flex-direction: column; align-items: center; background: rgba(0,0,0,0.3); padding: 2vh; border-radius: 15px; }
        
        .result-container { display: flex; flex-direction: column; justify-content: center; align-items: center; flex: 1; text-align: center; }
        .review-list { flex: 1; overflow-y: auto; padding-right: 2vw; width: 100%; }
        .review-item { background: rgba(0,0,0,0.2); padding: 2vh; margin-bottom: 2vh; border-radius: 10px; border-right: 1vh solid var(--secondary); text-align: right; }
        .text-green { color: var(--green); } .text-red { color: var(--red); }
    
        /* ===== Mobile-friendly overrides (phones & portrait tablets) ===== */
        @media (max-width: 780px), (orientation: portrait) {
            body {
                height: 100vh;
                height: 100dvh;
            }
            #app-container {
                width: 100vw !important;
                height: 100vh !important;
                height: 100dvh !important;
                max-width: 100vw !important;
                max-height: 100dvh !important;
                border-radius: 0 !important;
            }
            .screen { padding: 20px 18px; }
            .icon-large { width: 64px; height: 64px; margin-bottom: 10px; }
            h1, .screen h1 { font-size: clamp(19px, 6vw, 27px) !important; margin-bottom: 10px !important; line-height: 1.35; }
            .subtitle { font-size: clamp(14px, 4vw, 17px); margin-bottom: 22px; line-height: 1.6; }
            .btn-large { font-size: clamp(15px, 4.4vw, 18px) !important; padding: 13px 26px !important; }
            .top-bar { font-size: clamp(12px, 3.4vw, 14px); margin-bottom: 10px; }
            .progress-container { height: 8px; margin-bottom: 14px; }
            .question-text { font-size: clamp(16px, 4.6vw, 20px); margin-bottom: 14px; line-height: 1.5; }
            .options-grid { grid-template-columns: 1fr; gap: 9px; margin-bottom: 14px; }
            .option-btn { font-size: clamp(13.5px, 3.8vw, 16px); padding: 13px 10px; border-width: 3px; }
            .feedback-container { padding: 12px 14px; }
            .feedback-message { font-size: clamp(15px, 4.2vw, 17px); margin-bottom: 8px; }
            .feedback-explanation { font-size: clamp(12.5px, 3.4vw, 14.5px); margin-bottom: 12px; }
            .btn-next { font-size: clamp(13px, 3.6vw, 15px) !important; padding: 9px 18px !important; }
            .score-circle { width: 120px; height: 120px; border-width: 7px; margin-bottom: 14px; }
            .score-text { font-size: clamp(24px, 7.5vw, 30px); }
            .percentage-text { font-size: clamp(13px, 3.8vw, 16px); }
            .evaluation-text { font-size: clamp(16px, 4.6vw, 20px); margin-bottom: 14px; }
            .result-buttons { flex-direction: column; gap: 10px; width: 100%; }
            .btn-secondary { font-size: clamp(13px, 3.6vw, 15px); padding: 11px 18px; width: 100%; box-sizing: border-box; }
            .result-container .btn-large { width: 100%; box-sizing: border-box; }
            .review-header { margin-bottom: 10px; padding-bottom: 8px; }
            .review-title { font-size: clamp(16px, 4.6vw, 19px); }
            .review-list { padding-right: 4px; gap: 10px; }
            .review-item { padding: 12px; border-right-width: 4px; }
            .review-q { font-size: clamp(13.5px, 3.8vw, 15.5px); margin-bottom: 6px; }
            .review-ans { font-size: clamp(12px, 3.4vw, 14px); gap: 6px; }
        }

        @media (max-width: 360px) {
            .score-circle { width: 100px; height: 100px; }
            .screen { padding: 16px 14px; }
        }

    </style>
</head>
<body>

<div id="app-container">
    <div id="screen-start" class="screen active">
        <div class="start-content">
            <h1>النَّصُّ الشِّعْرِيُّ: إِلَى الشَّبَابِ</h1>
            <button class="btn-large" onclick="startQuiz()">ابدأ الاختبار</button>
        </div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="top-bar">
            <div id="progress-text">السُّؤَالُ ١ / ٣٠</div>
            <div id="progress-percent">٠٪</div>
        </div>
        <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="question-text" class="question-text"></div>
        <div id="options-container" class="options-grid"></div>
        <div id="feedback-container" class="feedback-container">
            <div id="feedback-message" style="font-size: 4vh; font-weight: bold;"></div>
            <div id="feedback-explanation" style="font-size: 3vh; margin: 1vh 0;"></div>
            <button class="btn-next" onclick="nextQuestion()" style="background: var(--secondary); border: none; padding: 1vh 3vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">السؤال التالي</button>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <div class="result-container">
            <h1>نتيجة الاختبار</h1>
            <div id="score-text" style="font-size: 10vh;">٠/٣٠</div>
            <div style="display:flex; gap:2vh;">
                <button onclick="showReview()" style="padding: 1vh 2vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">مراجعة الإجابات</button>
                <button onclick="restartQuiz()" style="padding: 1vh 2vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">إعادة الاختبار</button>
            </div>
        </div>
    </div>

    <div id="screen-review" class="screen">
        <div style="margin-bottom: 2vh;"><h2 style="color: var(--secondary);">مراجعة الإجابات</h2></div>
        <div id="review-list" class="review-list"></div>
        <button class="btn-next" onclick="showScreen('screen-result')" style="padding: 1vh 3vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">العودة للنتيجة</button>
    </div>
</div>

<script>
    const allQuestions = [
        { q: "مَا مَعْنَى كَلِمَةِ «يَبْغِي» فِي قَوْلِ الشَّاعِرِ (يَبْغِي الصَّلَاحَ)؟", options: ["يَطْلُبُ", "يَكْرَهُ", "يَحْزَنُ", "يُسَافِرُ"], answer: "يَطْلُبُ", exp: "يَبْغِي بِمَعْنَى يَطْلُبُ وَيُرِيدُ." },
        { q: "مَا مَعْنَى «الصَّلَاح»؟", options: ["الِاسْتِقَامَةُ", "الْفَسَادُ", "الْجَمَالُ", "الْقُوَّةُ"], answer: "الِاسْتِقَامَةُ", exp: "الصَّلَاحُ هُوَ الِاسْتِقَامَةُ." },
        { q: "مَا مَعْنَى كلمة «نَبِيل»؟", options: ["شَرِيفٌ", "ضَعِيفٌ", "سَرِيعٌ", "قَدِيمٌ"], answer: "شَرِيفٌ", exp: "النَّبِيلُ هُوَ الشَّرِيفُ صَاحِبُ الخُلُقِ الحَسَنِ." },
        { q: "مَا مَعْنَى «جِهَاد»؟", options: ["بَذْلُ الْجُهْدِ", "نَوْمٌ", "سَفَرٌ", "حُزْنٌ"], answer: "بَذْلُ الْجُهْدِ", exp: "الْجِهَادُ هُوَ بَذْلُ أَقْصَى الْجُهْدِ." },
        { q: "مَا مَعْنَى «زَمَانُكُمْ» فِي سِيَاقِ النَّصِّ؟", options: ["وَقْتُكُمْ وَعَصْرُكُمْ", "مَكَانُكُمْ", "مَالُكُمْ", "أَصْدِقَاؤُكُمْ"], answer: "وَقْتُكُمْ وَعَصْرُكُمْ", exp: "يُشِيرُ لِوَقْتِ الشَّبَابِ الَّذِي يَعِيشُونَهُ." },
        { q: "مَا مَعْنَى «مَيْدَانُكُمْ»؟", options: ["مَجَالَ عَمَلِكُمْ", "المَلْعَبَ", "المَدْرَسَةَ", "البَيْتَ"], answer: "مَجَالَ عَمَلِكُمْ", exp: "المَيْدَانُ هُنَا يَعْنِي المَجَالَ أَوِ السَّاحَةَ الَّتِي يَعْمَلُ فِيهَا الشَّبَابُ." },
        { q: "مَا مَعْنَى «الْعُدَّة»؟", options: ["أَسْلِحَةٌ وَتَجْهِيزَاتٌ", "مَلَابِسُ", "أَمْوَالٌ", "كُتُبٌ"], answer: "أَسْلِحَةٌ وَتَجْهِيزَاتٌ", exp: "الْعُدَّةُ هِيَ مَا يُعَدُّ لِلْحَرْبِ مِنَ الأَسْلِحَةِ." },
        { q: "مَا مَعْنَى «الْعَتَاد»؟", options: ["مَا يُعَدُّ مِنْ عَدَدٍ وَأَسْلِحَةٍ", "طَعَامٌ", "مَاءٌ", "وَرَقٌ"], answer: "مَا يُعَدُّ مِنْ عَدَدٍ وَأَسْلِحَةٍ", exp: "الْعَتَادُ هُوَ مَا يُعَدُّ لِلدِّفَاعِ." },
        { q: "مَا مَعْنَى «دِيَارُكُمْ»؟", options: ["بَلَدُكُمْ", "بُيُوتُكُمْ", "مَدْرَسَتُكُمْ", "حَدِيقَتُكُمْ"], answer: "بَلَدُكُمْ", exp: "الدِّيَارُ هُنَا تُشِيرُ إِلَى أَرْضِ الوَطَنِ." },
        { q: "مَا مَعْنَى «هِبَة»؟", options: ["عَطَاءٌ وَمِنْحَةٌ", "خَسَارَةٌ", "قَرْضٌ", "دَيْنٌ"], answer: "عَطَاءٌ وَمِنْحَةٌ", exp: "الهِبَةُ هِيَ العَطَاءُ الَّذِي لَا يُطْلَبُ بَدَلًا." },
        { q: "مَا مَعْنَى «الآبَاد»؟", options: ["الدَّهْرُ الطَّوِيلُ", "الأَمْكِنَةُ", "الأَحْزَانُ", "الأَزْمِنَةُ السَّرِيعَةُ"], answer: "الدَّهْرُ الطَّوِيلُ", exp: "الآبَادُ هُوَ الدَّهْرُ الطَّوِيلُ." },
        { q: "مَا مَعْنَى «طَمَع»؟", options: ["رَغْبَةٌ شَدِيدَةٌ فِي شَيْءٍ", "خَوْفٌ", "حُبٌّ", "نَوْمٌ"], answer: "رَغْبَةٌ شَدِيدَةٌ فِي شَيْءٍ", exp: "الطَّمَعُ هُوَ الرَّغْبَةُ الشَّدِيدَةُ فِيمَا عِنْدَ الآخَرِينَ." },
        { q: "مَا المَقْصُودُ بـ «حُرْقَة»؟", options: ["شِدَّةُ الغَيْظِ", "فَرَحٌ", "هُدُوءٌ", "بُرُودَةٌ"], answer: "شِدَّةُ الغَيْظِ", exp: "حُرْقَةُ الحُسَّادِ تَعْنِي شِدَّةَ غَيْظِهِمْ." },
        { q: "مَا مَعْنَى «الْحُسَّاد»؟", options: ["مَنْ يَتَمَنَّوْنَ زَوَالَ النِّعْمَةِ", "الأَصْدِقَاءُ", "المُحِبُّونَ", "الغُرَبَاءُ"], answer: "مَنْ يَتَمَنَّوْنَ زَوَالَ النِّعْمَةِ", exp: "الحَاسِدُ هُوَ مَنْ يَتَمَنَّى زَوَالَ نِعْمَةِ غَيْرِهِ." },
        { q: "مَا مَعْنَى «السَّبِيل»؟", options: ["الطَّرِيقُ", "البَيْتُ", "النَّهْرُ", "العِلْمُ"], answer: "الطَّرِيقُ", exp: "السَّبِيلُ هُوَ الطَّرِيقُ." },
        { q: "مَا يَقْصِدُ الشَّاعِرُ بِـ (خَيْرُ الصَّحَائِفِ مَا كَتَبْتَ سُطُورَهُ)؟", options: ["أَهَمِّيَّةُ العَمَلِ وَالكِفَاحِ", "أَهَمِّيَّةُ الحِبْرِ", "أَهَمِّيَّةُ القِرَاءَةِ", "أَهَمِّيَّةُ الصُّحُفِ"], answer: "أَهَمِّيَّةُ العَمَلِ وَالكِفَاحِ", exp: "الإِنْجَازَاتُ الحَقِيقِيَّةُ تُكْتَبُ بِالكِفَاحِ، لَا بِالكَلَامِ." },
        { q: "مَا مَعْنَى «تَكَاتُفًا»؟", options: ["تَعَاوُنًا", "تَفَرُّقًا", "خَوْفًا", "بُعْدًا"], answer: "تَعَاوُنًا", exp: "تَكَاتُفًا يَعْنِي التَّعَاوُنَ وَالتَّرَابُطَ." },
        { q: "مَا مَعْنَى «وِدَاد»؟", options: ["مَحَبَّةٌ", "خَوْفٌ", "غَضَبٌ", "حُزْنٌ"], answer: "مَحَبَّةٌ", exp: "الوِدَادُ هُوَ المَحَبَّةُ الصَّادِقَةُ." },
        { q: "مَا مَعْنَى «مِدَاد»؟", options: ["حِبْرٍ", "قَلَمٍ", "وَرَقٍ", "كِتَابٍ"], answer: "حِبْرٍ", exp: "المِدَادُ هُوَ الحِبْرُ الَّذِي يُكْتَبُ بِهِ." },
        { q: "مَا مَعْنَى «الصَّحَائِف»؟", options: ["الكُتُبُ أَوِ الصُّحُفُ", "الجُدْرَانُ", "السَّمَاءُ", "الطَّرِيقُ"], answer: "الكُتُبُ أَوِ الصُّحُفُ", exp: "الصَّحَائِفُ جَمْعُ صَحِيفَةٍ." },
        { q: "مَا الْجَمَالُ فِي «نِيلُكُمْ هِبَةُ السَّمَاءِ»؟", options: ["تَصْوِيرٌ لِلنِّيلِ بِعَطَاءٍ مِنَ اللهِ", "تَصْوِيرٌ لِلنِّيلِ بِسَيَّارَةٍ", "تَصْوِيرٌ لِلسَّمَاءِ بِنَهْرٍ", "تَصْوِيرٌ لِأَرْضِ مِصْرَ بِمَطَرٍ"], answer: "تَصْوِيرٌ لِلنِّيلِ بِعَطَاءٍ مِنَ اللهِ", exp: "شَبَّهَهَا بِالهِبَةِ (العَطَاءِ) لِتَعْظِيمِ قِيمَتِهِ وَفَضْلِهِ عَلَى مِصْرَ." },
        { q: "مَا الْجَمَالُ فِي «بِيَدِ الكِفَاحِ الْحُرِّ»؟", options: ["تَصْوِيرٌ لِلْكِفَاحِ بِإِنْسَانٍ لَهُ يَدٌ", "تَصْوِيرٌ لِلْيَدِ بِشَجَرَةٍ", "تَصْوِيرٌ لِلْحُرِّيَّةِ بِطَائِرٍ", "تَصْوِيرٌ لِلكِفَاحِ بِمَالٍ"], answer: "تَصْوِيرٌ لِلْكِفَاحِ بِإِنْسَانٍ لَهُ يَدٌ", exp: "تعبير يجسد الكفاح في صورة إنسان يكتب بيده ليدل على فاعليته." },
        { q: "مَا الْغَرَضُ مِنَ الْأَمْرِ فِي «قُلْ لِلَّذِي يَبْغِي الصَّلَاحَ»؟", options: ["النُّصْحُ وَالْإِرْشَادُ", "التَّحْذِيرُ", "السُّخْرِيَةُ", "الخَوْفُ"], answer: "النُّصْحُ وَالْإِرْشَادُ", exp: "يَنْصَحُ الشَّاعِرُ مَنْ يَبْغِي الصَّلَاحَ بِالِاسْتِمَاعِ لِخِطَابِهِ." },
        { q: "مَا دَلَالَةُ «لَا بِمِدَادِ»؟", options: ["أَهَمِّيَّةُ الْعَمَلِ لَا الْكَلَامِ", "دَعْوَةٌ لِتَرْكِ القِرَاءَةِ", "تَحْذِيرٌ مِنَ الحِبْرِ", "سُخْرِيَةٌ مِنَ الشَّبَابِ"], answer: "أَهَمِّيَّةُ الْعَمَلِ لَا الْكَلَامِ", exp: "الكَلَامُ الَّذِي يُكْتَبُ بِالمِدَادِ (الحِبْرِ) لا يُعَادِلُ قِيمَةَ العَمَلِ وَالكِفَاحِ." },
        { q: "مَاذَا أَفَادَ النِّدَاءُ فِي «يَا مِصْرُ»؟", options: ["حُبَّ الشَّاعِرِ لِمِصْرَ وَتَعْظِيمَهَا", "التَّحْذِيرَ", "السُّخْرِيَةَ", "الخَوْفَ"], answer: "حُبَّ الشَّاعِرِ لِمِصْرَ وَتَعْظِيمَهَا", exp: "نِدَاءُ الوطن يُظْهِرُ مَشَاعِرَ الحُبِّ وَالفَخْرِ." },
        { q: "مَا الْجَمَالُ فِي «عُدَّةٍ وَعَتَادٍ»؟", options: ["تَصْوِيرٌ لِتَجْهِيزَاتِ الْحَرْبِ", "سَخْرِيَةٌ", "وَصْفٌ لِلزَّمَانِ", "تَشْبِيهٌ"], answer: "تَصْوِيرٌ لِتَجْهِيزَاتِ الْحَرْبِ", exp: "يُظْهِرُ الِاسْتِعْدَادَ القَوِيَّ لِلدِّفَاعِ عَنِ الوَطَنِ." },
        { q: "مَا الْجَمَالُ فِي (زَمَانُكُمْ - مَيْدَانُكُمْ)؟", options: ["إِيقَاعٌ مُوسِيقِيٌّ جَمِيلٌ", "تَضَادٌّ", "تَشْبِيهٌ", "كُلُّ مَا سَبَقَ"], answer: "إِيقَاعٌ مُوسِيقِيٌّ جَمِيلٌ", exp: "التَّنَاغُمُ بَيْنَ الكَلِمَتَيْنِ يُعْطِي نَغَمًا مُوسِيقِيًّا جَذَّابًا." },
        { q: "مَاذَا يَقْصِدُ الشَّاعِرُ بِـ (الْكِفَاحِ الْحُرِّ لا بِمِدَادِ)؟", options: ["العمل الفعلي لا الكتابة النظرية", "السلاح الثقيل", "السرعة", "القوة"], answer: "العمل الفعلي لا الكتابة النظرية", exp: "يؤكد أن بناء الحضارة يحتاج لعمل وجهد حقيقي." },
        { q: "تَكْرَارُ «هَذِي دِيَارُكُمْ» يُفِيدُ:", options: ["التَّأْكِيدَ عَلَى انْتِمَاءِ الشَّبَابِ لِوَطَنِهِمْ", "التَّرَدُّدَ", "السُّخْرِيَةَ", "الخَوْفَ"], answer: "التَّأْكِيدَ عَلَى انْتِمَاءِ الشَّبَابِ لِوَطَنِهِمْ", exp: "التَّكْرَارُ يُعَزِّزُ مَعْنَى الانْتِمَاءِ وَالمَسْؤُولِيَّةِ." },
        { q: "مَا عَلَاقَةُ (تَأْلُفًا - تَكَاتُفًا)؟", options: ["تَعَاوُنٌ وَمُحَبَّةٌ", "تَضَادٌّ", "سُخْرِيَةٌ", "لَا شَيْءَ"], answer: "تَعَاوُنٌ وَمُحَبَّةٌ", exp: "العَطْفُ يُؤَكِّدُ ضَرُورَةَ التَّكَامُلِ بَيْنَ النَّاسِ." }
    ];

    let currentQ = 0, score = 0, userAnswers = [];
    let shuffledQuestions = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz() { 
        currentQ = 0; score = 0; userAnswers = [];
        shuffledQuestions = shuffleArray([...allQuestions]);
        showScreen('screen-quiz'); 
        setTimeout(loadQ, 100);
    }
    
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    
    function loadQ() {
        let q = shuffledQuestions[currentQ];
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('progress-bar').style.width = (currentQ/shuffledQuestions.length)*100 + "%";
        document.getElementById('progress-text').innerText = `السُّؤَالُ ${toArabicNumeral(currentQ + 1)} / ${toArabicNumeral(shuffledQuestions.length)}`;
        
        let container = document.getElementById('options-container'); 
        container.innerHTML = '';
        document.getElementById('feedback-container').style.display = 'none';
        
        let optionsArr = [...q.options];
        shuffleArray(optionsArr);
        
        optionsArr.forEach(opt => {
            let btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt;
            btn.onclick = () => {
                document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                let isCorrect = (opt === q.answer);
                if(isCorrect) { score++; btn.classList.add('correct'); document.getElementById('feedback-message').innerText = "إِجَابَةٌ صَحِيحَةٌ ✓"; }
                else { btn.classList.add('wrong'); document.querySelectorAll('.option-btn').forEach(b => { if(b.innerText === q.answer) b.classList.add('correct'); }); document.getElementById('feedback-message').innerText = "إِجَابَةٌ خَاطِئَةٌ ✗"; }
                document.getElementById('feedback-explanation').innerText = q.exp;
                document.getElementById('feedback-container').style.display = 'flex';
                userAnswers.push({q: q.q, ans: opt, correct: q.answer, isCorrect: isCorrect});
            };
            container.appendChild(btn);
        });
    }
    
    function nextQuestion() { 
        currentQ++; 
        if(currentQ < shuffledQuestions.length) loadQ(); 
        else { 
            document.getElementById('score-text').innerText = toArabicNumeral(score) + "/" + toArabicNumeral(shuffledQuestions.length); 
            showScreen('screen-result'); 
        } 
    }
    function toArabicNumeral(n) { return n.toString().split('').map(c => '٠١٢٣٤٥٦٧٨٩'[c] || c).join(''); }
    function restartQuiz() { showScreen('screen-start'); }
    function showReview() {
        let list = document.getElementById('review-list'); list.innerHTML = '';
        userAnswers.forEach((a, i) => {
            let item = document.createElement('div');
            item.className = 'review-item';
            item.innerHTML = `<div class="review-q">${toArabicNumeral(i+1)}. ${a.q}</div>
            <div class="${a.isCorrect ? 'text-green' : 'text-red'}">إجابتك: ${a.ans} ${a.isCorrect ? '✓' : '✗'}</div>
            ${!a.isCorrect ? `<div class="text-green">الإجابة الصحيحة: ${a.correct}</div>` : ''}`;
            list.appendChild(item);
        });
        showScreen('screen-review');
    }
</script>
</body>
