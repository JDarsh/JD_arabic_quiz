<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اخْتِبَارٌ تَفَاعُلِيّ - النَّكِرَةُ وَالْمَعْرِفَةُ</title>
    <style>
        :root {
            --primary: #312e81; /* Deep Indigo 900 */
            --secondary: #06b6d4; /* Cyan 500 */
            --white: #ffffff;
            --green: #10b981;
            --red: #ef4444;
            --dark-bg: #1e1b4b; /* Indigo 950 */
            --text-dark: #0f172a;
            --black-bg: #020617;
        }

        body { margin: 0; padding: 0; background-color: var(--black-bg); display: flex; justify-content: center; align-items: center; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; user-select: none; }
        #app-container { background-color: var(--primary); color: var(--white); width: 100vw; height: 56.25vw; max-height: 100vh; max-width: 177.78vh; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.9); display: flex; flex-direction: column; overflow: hidden; border-radius: 12px; background-image: radial-gradient(circle at top right, rgba(6, 182, 212, 0.15), transparent 60%); }
        .screen { display: none; flex-direction: column; width: 100%; height: 100%; padding: 4vh 5vw; box-sizing: border-box; }
        .screen.active { display: flex; }

        .start-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        h1 { font-size: 6.5vh; color: var(--secondary); margin: 0 0 2vh 0; text-shadow: 3px 3px 6px rgba(0,0,0,0.4); }
        .subtitle { font-size: 4.5vh; margin-bottom: 6vh; font-weight: bold; }
        .btn-large { background-color: var(--secondary); color: var(--text-dark); font-size: 5vh; font-weight: bold; padding: 2vh 6vw; border: none; border-radius: 50px; cursor: pointer; transition: transform 0.1s; }
        .btn-large:active { transform: scale(0.95); }

        .top-bar { display: flex; justify-content: space-between; align-items: center; font-size: 3vh; font-weight: bold; margin-bottom: 2vh; color: var(--secondary); }
        .progress-container { width: 100%; height: 2vh; background: rgba(255,255,255,0.2); border-radius: 20px; overflow: hidden; margin-bottom: 4vh; }
        .progress-bar { height: 100%; background-color: var(--secondary); width: 0%; transition: width 0.3s; }
        .question-text { font-size: 4.5vh; font-weight: bold; text-align: center; margin-bottom: 4vh; flex: 1; display: flex; align-items: center; justify-content: center; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2vh; margin-bottom: 4vh; }
        .option-btn { background: var(--white); color: var(--text-dark); font-size: 3.5vh; font-weight: bold; padding: 2vh; border-radius: 15px; cursor: pointer; border: none; transition: all 0.2s; }
        .option-btn.correct { background: var(--green); color: var(--white); }
        .option-btn.wrong { background: var(--red); color: var(--white); }
        .feedback-container { display: none; flex-direction: column; align-items: center; background: rgba(0,0,0,0.3); padding: 2vh; border-radius: 15px; }
        
        .result-container { display: flex; flex-direction: column; justify-content: center; align-items: center; flex: 1; text-align: center; }
        .review-list { flex: 1; overflow-y: auto; padding-right: 2vw; width: 100%; }
        .review-item { background: rgba(0,0,0,0.2); padding: 2vh; margin-bottom: 2vh; border-radius: 10px; border-right: 1vh solid var(--secondary); text-align: right; }
        .text-green { color: var(--green); } .text-red { color: var(--red); }
    </style>
</head>
<body>

<div id="app-container">
    <div id="screen-start" class="screen active">
        <div class="start-content">
            <h1>النَّكِرَةُ وَالْمَعْرِفَةُ</h1>
            <button class="btn-large" onclick="startQuiz()">ابدأ الاختبار</button>
        </div>
    </div>

    <div id="screen-quiz" class="screen">
        <div class="top-bar">
            <div id="progress-text">السُّؤَالُ ١ / ٣٠</div>
            <div id="progress-percent">٠٪</div>
        </div>
        <div class="progress-container"><div id="progress-bar" class="progress-bar"></div></div>
        <div id="question-text" class="question-text"></div>
        <div id="options-container" class="options-grid"></div>
        <div id="feedback-container" class="feedback-container">
            <div id="feedback-message" style="font-size: 4vh; font-weight: bold;"></div>
            <div id="feedback-explanation" style="font-size: 3vh; margin: 1vh 0;"></div>
            <button class="btn-next" onclick="nextQuestion()" style="background: var(--secondary); border: none; padding: 1vh 3vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">السؤال التالي</button>
        </div>
    </div>

    <div id="screen-result" class="screen">
        <div class="result-container">
            <h1>نتيجة الاختبار</h1>
            <div id="score-text" style="font-size: 10vh;">٠/٣٠</div>
            <div style="display:flex; gap:2vh;">
                <button onclick="showReview()" style="padding: 1vh 2vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">مراجعة الإجابات</button>
                <button onclick="restartQuiz()" style="padding: 1vh 2vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">إعادة الاختبار</button>
            </div>
        </div>
    </div>

    <div id="screen-review" class="screen">
        <div style="margin-bottom: 2vh;"><h2 style="color: var(--secondary);">مراجعة الإجابات</h2></div>
        <div id="review-list" class="review-list"></div>
        <button class="btn-next" onclick="showScreen('screen-result')" style="padding: 1vh 3vw; border-radius: 20px; cursor: pointer; font-size: 3vh;">العودة للنتيجة</button>
    </div>
</div>

<script>
    const questions = [
        { q: "مَا هُوَ التَّعْرِيفُ الصَّحِيحُ لِلِاسْمِ النَّكِرَةِ؟", options: ["اسْمٌ يَدُلُّ عَلَى شَيْءٍ مُحَدَّدٍ", "اسْمٌ يَدُلُّ عَلَى شَيْءٍ غَيْرِ مُحَدَّدٍ", "فِعْلٌ يَدُلُّ عَلَى حَدَثٍ", "حَرْفٌ يَرْبِطُ الجُمَلَ"], answer: "اسْمٌ يَدُلُّ عَلَى شَيْءٍ غَيْرِ مُحَدَّدٍ", exp: "النَّكِرَةُ اسْمٌ لَا يُشِيرُ إِلَى مُعَيَّنٍ." },
        { q: "أَيُّ كَلِمَةٍ مِمَّا يَلِي تُعَدُّ (مَعْرِفَةً)؟", options: ["شَجَرَةٌ", "قَلَمٌ", "القَاهِرَةُ", "بَيْتٌ"], answer: "القَاهِرَةُ", exp: "القَاهِرَةُ عَلَمٌ (مَعْرِفَةٌ)." },
        { q: "مَا نَوْعُ المعْرِفَةِ فِي كَلِمَةِ «المُعَلِّمُ»؟", options: ["مُعَرَّفٌ بِـ (الـ)", "عَلَمٌ", "ضَمِيرٌ", "اسْمُ إِشَارَةٍ"], answer: "مُعَرَّفٌ بِـ (الـ)", exp: "بَدَأَتْ بِـ (الـ) التَّعْرِيفِ." },
        { q: "أَيُّ الكَلِمَاتِ التَّالِيَةِ تُعْتَبَرُ (نَكِرَةً)؟", options: ["مُحَمَّدٌ", "مَدْرَسَةٌ", "هَذَا", "نَحْنُ"], answer: "مَدْرَسَةٌ", exp: "لَا تَدُلُّ عَلَى مُحَدَّدٍ وَخَالِيَةٌ مِنَ المَعَارِفِ." },
        { q: "مَا نَوْعُ المعْرِفَةِ فِي كَلِمَةِ «أَحْمَدُ»؟", options: ["مُعَرَّفٌ بِـ (الـ)", "عَلَمٌ", "اسْمُ إِشَارَةٍ", "اسْمٌ مَوْصُولٌ"], answer: "عَلَمٌ", exp: "أَحْمَدُ عَلَمٌ لِشَخْصٍ." },
        { q: "مَا نَوْعُ المعْرِفَةِ فِي كَلِمَةِ «هُوَ»؟", options: ["ضَمِيرٌ", "عَلَمٌ", "مُعَرَّفٌ بِـ (الـ)", "اسْمُ إِشَارَةٍ"], answer: "ضَمِيرٌ", exp: "هُوَ ضَمِيرُ غَائِبٍ." },
        { q: "«هَذَانِ كِتَابَانِ». مَا نَوْعُ المعْرِفَةِ «هَذَانِ»؟", options: ["اسْمُ إِشَارَةٍ", "اسْمٌ مَوْصُولٌ", "عَلَمٌ", "ضَمِيرٌ"], answer: "اسْمُ إِشَارَةٍ", exp: "هَذَانِ يُشَارُ بِهَا إِلَى المُثَنَّى المُذَكَّرِ." },
        { q: "أَيُّ مِمَّا يَلِي يُعَدُّ مَعْرِفَةً بِـ (الـ)؟", options: ["الْكِتَابُ", "قَلَمٌ", "مُحَمَّدٌ", "نَحْنُ"], answer: "الْكِتَابُ", exp: "اتَّصَلَتْ بِهَا أَلِفُ وَلَامُ التَّعْرِيفِ." },
        { q: "أَيُّ الكَلِمَاتِ الآتِيَةِ مَعْرِفَةٌ (بِالإِضَافَةِ)؟", options: ["قَلَمُ مُحَمَّدٍ", "قَلَمٌ", "المُحَمَّدُ", "هَذَا"], answer: "قَلَمُ مُحَمَّدٍ", exp: "أُضِيفَ لِاسْمٍ مَعْرِفَةٍ (أَحْمَدُ) فَأَصْبَحَ مَعْرِفَةً." },
        { q: "«الَّذِي» فِي الجُمْلَةِ يُعَدُّ مَعْرِفَةً؛ فَمَا نَوْعُهُ؟", options: ["ضَمِيرٌ", "عَلَمٌ", "اسْمٌ مَوْصُولٌ", "اسْمُ إِشَارَةٍ"], answer: "اسْمٌ مَوْصُولٌ", exp: "الَّذِي مِنْ الأَسْمَاءِ المَوْصُولَةِ." },
        { q: "«أَنَا» ضَمِيرٌ، هَلْ هُوَ مَعْرِفَةٌ أَمْ نَكِرَةٌ؟", options: ["مَعْرِفَةٌ", "نَكِرَةٌ", "لَا هَذَا وَلَا ذَاكَ", "حَرْفٌ"], answer: "مَعْرِفَةٌ", exp: "كُلُّ الضَّمَائِرِ (مُنْفَصِلَةً أَوْ مُتَّصِلَةً) مِنْ المَعَارِفِ." },
        { q: "مَا نَوْعُ المعْرِفَةِ فِي كَلِمَةِ «نَحْنُ»؟", options: ["عَلَمٌ", "ضَمِيرٌ", "مُعَرَّفٌ بِـ (الـ)", "اسْمُ إِشَارَةٍ"], answer: "ضَمِيرٌ", exp: "نَحْنُ ضَمِيرُ مُتَكَلِّمٍ." },
        { q: "«تِلْمِيذُ المَدْرَسَةِ مُجْتَهِدٌ». الكَلِمَةُ المَعْرِفَةُ بِـ (الإِضَافَةِ) هِيَ:", options: ["تِلْمِيذُ", "المَدْرَسَةِ", "مُجْتَهِدٌ", "لَا يُوجَدُ"], answer: "تِلْمِيذُ", exp: "أُضِيفَتْ إِلَى المَدْرَسَةِ (مَعْرِفَةٌ بِـ الـ) فَأَصْبَحَتْ مَعْرِفَةً." },
        { q: "أيُّ التَّالِي لَيْسَ مِنَ المَعَارِفِ؟", options: ["مُحَمَّدٌ", "قَلَمٌ", "نَحْنُ", "هَذِهِ"], answer: "قَلَمٌ", exp: "كَلِمَةٌ لَا تَدُلُّ عَلَى مُحَدَّدٍ وَلَيْسَ بِهَا عَلامَةُ مَعْرِفَةٍ." },
        { q: "مَا نَوْعُ المعْرِفَةِ فِي «مِصْرُ»؟", options: ["عَلَمٌ", "مُعَرَّفٌ بِـ (الـ)", "ضَمِيرٌ", "اسْمٌ مَوْصُولٌ"], answer: "عَلَمٌ", exp: "مِصْرُ عَلَمٌ لِبَلَدٍ." },
        { q: "«هِيَ» ضَمِيرٌ يَدُلُّ عَلَى:", options: ["المُتَكَلِّمِ", "المُخَاطَبِ", "الغَائِبِ", "النَّكِرَةِ"], answer: "الغَائِبِ", exp: "ضَمِيرُ غَائِبٍ لِلْمُفْرَدَةِ المُؤَنَّثَةِ." },
        { q: "أَيُّ الكَلِمَاتِ الآتِيَةِ تُعْتَبَرُ مَعْرِفَةً؟", options: ["بَابٌ", "قَلَمٌ", "مُحَمَّدٌ", "كِتَابٌ"], answer: "مُحَمَّدٌ", exp: "مُحَمَّدٌ عَلَمٌ (مَعْرِفَةٌ)، بَيْنَمَا بَاقِي الكَلِمَاتِ نَكِرَةٌ." },
        { q: "أَيُّ الكَلِمَاتِ الآتِيَةِ تُعْتَبَرُ (مَعْرِفَةً)؟", options: ["قَلَمٌ", "بَابٌ", "نَحْنُ", "كِتَابٌ"], answer: "نَحْنُ", exp: "الضَّمَائِرُ كُلُّهَا مَعَارِفُ." },
        { q: "كَلِمَةُ «هَذِهِ» مَعْرِفَةٌ نَوْعُهَا:", options: ["ضَمِيرٌ", "عَلَمٌ", "اسْمُ إِشَارَةٍ", "مُعَرَّفٌ بِـ (الـ)"], answer: "اسْمُ إِشَارَةٍ", exp: "هَذِهِ نَسْتَخْدِمُهَا لِلإِشَارَةِ لِلْمُفْرَدِ المُؤَنَّثِ." },
        { q: "مَا نَوْعُ الكَلِمَةِ «مَدْرَسَةٌ»؟", options: ["مَعْرِفَةٌ", "نَكِرَةٌ"], answer: "نَكِرَةٌ", exp: "لَا تَدُلُّ عَلَى مُحَدَّدٍ وَخَالِيَةٌ مِنَ المَعَارِفِ." },
        { q: "الاسم النكرة يَدُلُّ دائماً على مَعْنًى محدد.", options: ["صواب", "خطأ"], answer: "خطأ", exp: "النكرة تدل على شيء غير محدد." },
        { q: "كل الضمائر تُعد من الأسماء المعرفة.", options: ["صواب", "خطأ"], answer: "صواب", exp: "الضمائر جميعها (سواء منفصلة أو متصلة) معارف." },
        { q: "اسم الإشارة (هَذَانِ) يُعَدُّ اسْمًا نَكِرَةً.", options: ["صواب", "خطأ"], answer: "خطأ", exp: "أَسْمَاءُ الإِشَارَةِ جَمِيعُهَا مِنَ المَعَارِفِ." },
        { q: "الاسْمُ المُضَافُ إِلَى ضَمِيرٍ يُعَدُّ مَعْرِفَةً.", options: ["صواب", "خطأ"], answer: "صواب", exp: "بِالفِعْلِ، إِضَافَةُ الاسْمِ لِضَمِيرٍ تُكَسِّبُهُ التَّعْرِيفَ (مثل: كِتَابُهُ)." },
        { q: "كلمة «مُدَرِّسٌ» نَكِرَةٌ.", options: ["صواب", "خطأ"], answer: "صواب", exp: "كَلِمَةٌ لَا تَدُلُّ عَلَى مُعَيَّنٍ." },
        { q: "الاسْمُ المَوْصُولُ «الَّذِينَ» نَوْعُهُ مَعْرِفَةٌ.", options: ["صواب", "خطأ"], answer: "صواب", exp: "الأَسْمَاءُ المَوْصُولَةُ كُلُّهَا مَعَارِفُ." },
        { q: "كلمة «مَدْرَسَتِي» مَعْرِفَةٌ بِالإِضَافَةِ لِلضَّمِيرِ.", options: ["صواب", "خطأ"], answer: "صواب", exp: "إِضَافَةُ الكَلِمَةِ لِيَاءِ المُتَكَلِّمِ تَجْعَلُهَا مَعْرِفَةً." },
        { q: "العَلَمُ (مثل: مِصْرُ) لا يُعَدُّ مَعْرِفَةً.", options: ["صواب", "خطأ"], answer: "خطأ", exp: "الأَعْلَامُ مِنَ المَعَارِفِ." },
        { q: "كلمة «قَلَمُك» نَكِرَةٌ.", options: ["صواب", "خطأ"], answer: "خطأ", exp: "هِيَ مَعْرِفَةٌ لِأَنَّهَا مُضَافَةٌ لِضَمِيرٍ." },
        { q: "الاسم المعرف بـ (الـ) هو أشهر أنواع المعارف.", options: ["صواب", "خطأ"], answer: "صواب", exp: "يُعَدُّ مِنْ أَكْثَرِ المَعَارِفِ شُيُوعًا." }
    ];

    let currentQ = 0, score = 0, userAnswers = [];

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    function startQuiz() { currentQ = 0; score = 0; userAnswers = []; showScreen('screen-quiz'); loadQ(); }
    function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
    function loadQ() {
        let q = questions[currentQ];
        document.getElementById('question-text').innerText = q.q;
        document.getElementById('progress-bar').style.width = (currentQ/questions.length)*100 + "%";
        document.getElementById('progress-text').innerText = `السُّؤَالُ ${toArabicNumeral(currentQ + 1)} / ${toArabicNumeral(questions.length)}`;
        
        let container = document.getElementById('options-container'); 
        container.innerHTML = '';
        document.getElementById('feedback-container').style.display = 'none';
        
        let optionsArr = [...q.options];
        shuffleArray(optionsArr);
        
        optionsArr.forEach(opt => {
            let btn = document.createElement('button'); btn.className = 'option-btn'; btn.innerText = opt;
            btn.onclick = () => {
                document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
                let isCorrect = (opt === q.answer);
                if(isCorrect) { score++; btn.classList.add('correct'); document.getElementById('feedback-message').innerText = "إِجَابَةٌ صَحِيحَةٌ ✓"; }
                else { btn.classList.add('wrong'); document.querySelectorAll('.option-btn').forEach(b => { if(b.innerText === q.answer) b.classList.add('correct'); }); document.getElementById('feedback-message').innerText = "إِجَابَةٌ خَاطِئَةٌ ✗"; }
                document.getElementById('feedback-explanation').innerText = q.exp;
                document.getElementById('feedback-container').style.display = 'flex';
                userAnswers.push({q: q.q, ans: opt, correct: q.answer, isCorrect: isCorrect});
            };
            container.appendChild(btn);
        });
    }
    function nextQuestion() { 
        currentQ++; 
        if(currentQ < questions.length) loadQ(); 
        else { 
            document.getElementById('score-text').innerText = toArabicNumeral(score) + "/٣٠"; 
            showScreen('screen-result'); 
        } 
    }
    function toArabicNumeral(n) { return n.toString().split('').map(c => '٠١٢٣٤٥٦٧٨٩'[c] || c).join(''); }
    function restartQuiz() { showScreen('screen-start'); }
    function showReview() {
        let list = document.getElementById('review-list'); list.innerHTML = '';
        userAnswers.forEach((a, i) => {
            let item = document.createElement('div');
            item.className = 'review-item';
            item.innerHTML = `<div class="review-q">${toArabicNumeral(i+1)}. ${a.q}</div>
            <div class="${a.isCorrect ? 'text-green' : 'text-red'}">إجابتك: ${a.ans} ${a.isCorrect ? '✓' : '✗'}</div>
            ${!a.isCorrect ? `<div class="text-green">الإجابة الصحيحة: ${a.correct}</div>` : ''}`;
            list.appendChild(item);
        });
        showScreen('screen-review');
    }
</script>
</body>
</html>
